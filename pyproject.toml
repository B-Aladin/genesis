[project]
name = "genesis-see"
version = "0.2.0"
description = "GENESIS Part 1: reconstruct a device from photos and video with a LangChain agent team on Gemini"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langgraph==1.2.10",
    "langchain-google-genai==4.3.2",
    "langchain-mcp-adapters==0.3.1",
    "mcp==1.29.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
free-models = ["langchain-groq>=1.1", "langchain-ollama>=1.1"]   # quota fallback: Groq (free key) and Ollama (local)
mcp-tools = ["uv>=0.5"]                                          # provides uvx, which starts the Python MCP servers

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["genesis_see"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
